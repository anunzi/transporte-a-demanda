<script>
document.addEventListener("DOMContentLoaded", function () {
  var f = TAD.fmt, h = f.html, apps = TAD.apps;
  function $(sel) { return document.querySelector(sel); }

  var r = TAD.reservaReferencia();
  var u = TAD.usuario(r.usuario);
  var ruta = TAD.ruta(r.ruta), serv = TAD.servicio(r.servicio), v = TAD.vehiculo(ruta.vehiculo);
  var sube = serv.paradas.filter(function (p) { return p.parada === r.origen; })[0];
  var baja = serv.paradas.filter(function (p) { return p.parada === r.destino; })[0];
  var t = TAD.tarifa(r.origen, r.destino, r.perfil);
  var bono = TAD.tarifas.bonificaciones.filter(function (b) { return b.perfil === r.perfil; })[0];
  var pago = apps.viajero.pagos.filter(function (p) { return p.principal; })[0];
  var fecha = f.fechaLarga(r.fecha).replace(/ de \d{4}$/, "");

  $("[data-aviso-envio]").textContent = "Te hemos enviado un SMS al " + u.telefono + " con estos datos.";
  $("[data-codigo]").textContent = r.codigo;

  var filas = [
    ["Día", fecha.charAt(0).toUpperCase() + fecha.slice(1)],
    ["Recogida", sube.prevista + " · " + TAD.parada(r.origen).nombre],
    ["Llegada", baja.prevista + " · " + TAD.parada(r.destino).nombre],
    ["Viajeros", r.viajeros + (r.viajeros === 1 ? " persona" : " personas")],
    ["Vehículo", v.matricula + " · " + v.modelo + (v.pmr ? " · " + v.accesibilidad.toLowerCase() : "")],
    ["Ruta", ruta.id + " · " + ruta.nombre],
    ["Precio", f.euros(r.importe) + (bono ? " (" + bono.nombre.toLowerCase() + ", −" + f.porcentaje(t.pct) + ")" : "")],
    ["Pago", r.pago + (pago && r.pago.indexOf("Tarjeta") === 0 ? " " + pago.detalle : "")]
  ];
  if (r.nota) filas.push(["Nota", r.nota]);
  $("[data-detalles]").innerHTML = filas.map(function (x) { return "<dt>" + h(x[0]) + "</dt><dd>" + h(x[1]) + "</dd>"; }).join("");

  $("[data-calendario]").addEventListener("click", function () {
    TADUI.toast("Viaje añadido a tu calendario: " + fecha + ", " + sube.prevista + ". Te avisaremos 30 minutos antes.", { titulo: "Añadido al calendario" });
  });
  $("[data-compartir]").addEventListener("click", function () {
    TADUI.toast("Hemos preparado un mensaje con tu código " + r.codigo + " para enviarlo a un familiar.", { titulo: "Compartir" });
  });
});
</script>
