<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Perfil · App del viajero · Plataforma Digital TAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout-mobile.css">
<script defer src="../js/data.js"></script>
<script defer src="../js/datos/apps.js"></script>
<script defer src="../js/ui.js"></script>
<script defer src="../js/nav.js"></script>
</head>
<body class="mob-body" data-module="viajero" data-page="app-viajero-perfil">
<a class="c-index-link c-index-link--floating" href="../login.html">← Cambiar de perfil</a>
<main class="mob-stage">
  <div class="c-phone-frame" data-accent="viajero" data-telefono>
    <div class="c-phone-frame__screen">
      <span class="c-phone-frame__notch" aria-hidden="true"></span>
      <div class="c-phone-frame__status" aria-hidden="true"><span data-tad-hora></span><span class="c-phone-frame__indicators"><span class="c-phone-frame__signal"><i></i><i></i><i></i><i></i></span><span class="c-phone-frame__battery"></span></span></div>
      <header class="app-bar">
        <h1 class="app-bar__title">Perfil</h1>
        <button class="c-btn c-btn--ghost c-btn--icon" type="button" aria-label="Editar mis datos" data-toast-title="Editar datos" data-toast="Para cambiar tu nombre o tu DNI, llama a la central o acude a tu ayuntamiento."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon c-icon--lg" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
      </header>
      <div class="c-phone-frame__content">
        <div class="app-content">
          <div style="display:flex;align-items:center;gap:var(--sp-3)">
            <span class="c-avatar c-avatar--lg" aria-hidden="true" data-iniciales></span>
            <div style="min-width:0">
              <p style="margin:0;font-size:var(--fs-18);font-weight:var(--fw-semibold)" data-nombre></p>
              <p class="u-muted" style="margin:0 0 var(--sp-1);font-size:var(--fs-14)" data-lugar></p>
              <span data-perfil></span>
            </div>
          </div>

          <section class="app-section" aria-labelledby="t-datos">
            <h2 class="app-section__title" id="t-datos">Mis datos</h2>
            <div class="c-card"><div class="c-card__body" style="padding:var(--sp-4)">
              <dl class="c-datalist" data-datos></dl>
            </div></div>
          </section>

          <section class="app-section" aria-labelledby="t-pagos">
            <h2 class="app-section__title" id="t-pagos">Formas de pago</h2>
            <div class="c-card"><ul class="c-list" data-pagos></ul></div>
            <button class="c-btn c-btn--ghost c-btn--block" type="button" style="margin-top:var(--sp-2)" data-toast-title="Añadir forma de pago" data-toast="En la app real se abriría la pasarela de pago segura. En esta maqueta no se guarda nada."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Añadir forma de pago</button>
          </section>

          <section class="app-section" aria-labelledby="t-avisos">
            <h2 class="app-section__title" id="t-avisos">Cómo quieres recibir los avisos</h2>
            <div class="c-card"><div class="c-card__body" style="padding:var(--sp-2) var(--sp-4)">
              <fieldset style="border:0;margin:0;padding:0;display:grid">
                <legend class="u-visually-hidden">Canal de avisos</legend>
                <div data-avisos style="display:grid"></div>
              </fieldset>
            </div></div>
          </section>

          <section class="app-section" aria-labelledby="t-idioma">
            <h2 class="app-section__title" id="t-idioma">Idioma</h2>
            <div class="c-field"><label class="c-field__label u-visually-hidden" for="idioma">Idioma de la app</label><select class="c-select" id="idioma" data-idioma></select></div>
          </section>

          <section class="app-section" aria-labelledby="t-acc">
            <h2 class="app-section__title" id="t-acc">Accesibilidad</h2>
            <div class="c-card"><div class="c-card__body" style="padding:var(--sp-2) var(--sp-4);display:grid">
              <label class="c-switch" style="justify-content:space-between;flex-direction:row-reverse"><input type="checkbox" role="switch" data-texto-grande> Texto grande</label>
              <label class="c-switch" style="justify-content:space-between;flex-direction:row-reverse;border-top:var(--bw) solid var(--color-border)"><input type="checkbox" role="switch" data-alto-contraste> Alto contraste</label>
            </div></div>
            <p class="u-muted u-small" style="margin:var(--sp-2) 0 0">Los cambios se ven al momento en esta pantalla.</p>
          </section>

          <a class="c-btn c-btn--secondary c-btn--block" href="../login.html" style="margin:var(--sp-6) 0 var(--sp-4)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Cerrar sesión</a>
        </div>
      </div>
      <nav class="app-tabbar" aria-label="Menú de la app">
        <a class="app-tabbar__tab" href="home.html" data-page="app-viajero-home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg><span>Inicio</span></a>
        <a class="app-tabbar__tab" href="confirmacion.html" data-page="app-viajero-confirmacion"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Reservar</span></a>
        <a class="app-tabbar__tab" href="seguimiento.html" data-page="app-viajero-seguimiento"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Mis viajes</span></a>
        <a class="app-tabbar__tab" href="perfil.html" data-page="app-viajero-perfil"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><span>Perfil</span></a>
      </nav>
      <span class="c-phone-frame__home" aria-hidden="true"></span>
    </div>
  </div>
  <p class="mob-caption">App del viajero · Perfil</p>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var f = TAD.fmt, h = f.html, ajustes = TAD.apps.viajero;
  function $(sel) { return document.querySelector(sel); }
  var ICONO = { tarjeta: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon c-icon--lg" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.8a7 7 0 1 0 0 10.4"/><path d="M4 10h9M4 14h9"/></svg>', bizum: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="c-icon c-icon--lg" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 4h3.3l1.6 4.4-2.1 1.4a11.5 11.5 0 0 0 6.2 6.2l1.4-2.1 4.4 1.6v3.3a1.6 1.6 0 0 1-1.7 1.6A16 16 0 0 1 3.6 5.7 1.6 1.6 0 0 1 5.2 4z"/></svg>' };

  var u = TAD.usuario(ajustes.usuario);
  var bono = TAD.tarifas.bonificaciones.filter(function (b) { return b.perfil === u.bonificacion; })[0];
  var perfil = u.perfil === "PMR" ? "PMR" : u.perfil.charAt(0).toUpperCase() + u.perfil.slice(1);

  $("[data-iniciales]").textContent = u.iniciales;
  $("[data-nombre]").textContent = u.nombre;
  $("[data-lugar]").textContent = TAD.nucleo(u.nucleo).nombre + " · " + u.edad + " años";
  $("[data-perfil]").innerHTML = '<span class="c-badge c-badge--success">' + h(perfil + " · bonificación " + f.porcentaje(u.bonificacionPct)) + "</span>";

  var datos = [
    ["DNI", u.dni],
    ["Teléfono", u.telefono],
    ["Municipio", TAD.municipio(u.municipio).nombre],
    ["Bonificación", bono ? bono.nombre + " (" + f.porcentaje(bono.pct) + "), la paga el " + bono.financia.charAt(0).toLowerCase() + bono.financia.slice(1) : "Sin bonificación"]
  ];
  $("[data-datos]").innerHTML = datos.map(function (x) { return "<dt>" + h(x[0]) + "</dt><dd>" + h(x[1]) + "</dd>"; }).join("");

  $("[data-pagos]").innerHTML = ajustes.pagos.map(function (p) {
    return '<li class="c-list__item"><button class="c-list__button" type="button" data-toast-title="' + h(p.nombre) + '" data-toast="' +
      (p.principal ? "Es tu forma de pago principal." : "La usaremos si eliges pagar con " + h(p.nombre) + " al reservar.") + '">' +
      '<span class="c-avatar" aria-hidden="true">' + ICONO[p.id] + '</span><span><span class="c-list__title">' + h(p.nombre) + '</span><span class="c-list__meta" style="font-size:var(--fs-14)">' + h(p.detalle) + "</span></span>" +
      (p.principal ? '<span class="c-badge c-badge--info">Principal</span>' : "<span></span>") + "</button></li>";
  }).join("");

  $("[data-avisos]").innerHTML = ajustes.avisos.opciones.map(function (o, i) {
    return '<label class="c-radio"' + (i ? ' style="border-top:var(--bw) solid var(--color-border)"' : "") + '><input type="radio" name="avisos" value="' + o.id + '"' +
      (o.id === ajustes.avisos.elegido ? " checked" : "") + "> " + h(o.nombre) + "</label>";
  }).join("");
  document.querySelectorAll('input[name="avisos"]').forEach(function (r) {
    r.addEventListener("change", function () { TADUI.toast("Te avisaremos por: " + r.parentNode.textContent.trim() + ".", { titulo: "Avisos" }); });
  });

  $("[data-idioma]").innerHTML = ajustes.idioma.opciones.map(function (o) {
    return '<option value="' + o.id + '"' + (o.id === ajustes.idioma.elegido ? " selected" : "") + ' lang="' + o.id + '">' + h(o.nombre) + "</option>";
  }).join("");
  $("[data-idioma]").addEventListener("change", function () {
    TADUI.toast("En esta maqueta los textos se quedan en castellano.", { titulo: "Idioma" });
  });

  // Accesibilidad: cambian el aspecto de la app dentro del marco usando los tokens existentes
  var telefono = $("[data-telefono]"), raiz = getComputedStyle(document.documentElement);
  var escala = ["--fs-12", "--fs-14", "--fs-16", "--fs-18", "--fs-22", "--fs-28", "--fs-36"];
  function textoGrande(si) {
    escala.forEach(function (t, i) {
      if (si) telefono.style.setProperty(t, raiz.getPropertyValue(escala[Math.min(i + 1, escala.length - 1)]).trim());
      else telefono.style.removeProperty(t);
    });
  }
  var contraste = {
    "--color-text-muted": "var(--ink-900)",
    "--ink-600": "var(--ink-900)",
    "--color-border": "var(--ink-700)",
    "--color-border-strong": "var(--ink-900)",
    "--color-primary": "var(--tad-blue-900)",
    "--bw": "var(--bw-strong)"
  };
  function altoContraste(si) {
    Object.keys(contraste).forEach(function (t) {
      if (si) telefono.style.setProperty(t, contraste[t]);
      else telefono.style.removeProperty(t);
    });
  }
  var tg = $("[data-texto-grande]"), ac = $("[data-alto-contraste]");
  tg.checked = ajustes.accesibilidad.textoGrande;
  ac.checked = ajustes.accesibilidad.altoContraste;
  tg.addEventListener("change", function () { textoGrande(tg.checked); });
  ac.addEventListener("change", function () { altoContraste(ac.checked); });
  textoGrande(tg.checked);
  altoContraste(ac.checked);
});
</script>
</body>
</html>
